[package]
name = "hanpai-in-group"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "一个长期记忆、会自己判断要不要插话的 QQ 群聊机器人"

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "net",
] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
