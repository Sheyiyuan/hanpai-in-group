# =============================================================================
# hanpai-in-group 配置
#
# 用法：
#   1. cp config.example.toml config.toml
#   2. 只改你关心的行，其余保持默认即可
#   3. 群内 /reload 热重载；标了「需重启」的项改完要重启进程
#
# 约定：
#   - 所有字段都有默认值，删掉某一行不会报错，会退回默认值
#   - 字段名写错、类型不对、取值越界 → 启动直接失败并指出哪一项，不会静默用默认值
#   - 密钥只从环境变量读，不要写进这个文件
# =============================================================================


# -----------------------------------------------------------------------------
# [bot] 机器人身份
#
# 这是它在 QQ 上的「躯壳」：账号、名字、被叫到的称呼。
# 「它是谁」这种性格层面的东西在下面的 [persona] 里，两处别混。
# -----------------------------------------------------------------------------
[bot]
qq = 10001 # int，必填。机器人自己的 QQ 号。
# 必须和 NapCat 登录的账号完全一致，否则机器人会把
# 自己发的消息当成别人说的，出现自己接自己话的怪象。

nickname = "半拍" # str，默认 "hanpai"。它的显示名。
# persona.name 留空时，也用它作为角色名。

aliases = ["半拍"] # list[str]，默认 []。群友可能用来叫它的称呼。
# 命中任意一个即视为「在叫它」，会跳过概率判定直接回。
# 可以再加 ["半拍", "半拍酱"]。
# 别填太常见的词，否则天天被误触发。


# -----------------------------------------------------------------------------
# [onebot] 接入 NapCat 的方式
#
# 我们做的是「反向 WebSocket」：不是我们去连 NapCat，而是 NapCat 连过来。
# 好处是不需要公网 IP、不需要额外开 HTTP 端口。
# -----------------------------------------------------------------------------
[onebot]
listen = "0.0.0.0:3001" # str，默认 "0.0.0.0:3001"。WebSocket 监听地址。【需重启】
# 0.0.0.0 表示所有网卡；只想本机连就写 127.0.0.1。
# 改这里要同时改 NapCat 那边的连接地址。

path = "/onebot" # str，默认 "/onebot"。WebSocket 路径。【需重启】
# 必须以 / 开头。和 NapCat 里填的 URL 路径保持一致。

access_token_env = "ONEBOT_TOKEN" # 读 token 的环境变量名
# str | 可省略，默认 "ONEBOT_TOKEN"。
# 从哪个环境变量读鉴权 token。
# NapCat 连接时带 Authorization: Bearer <token>。
# 配了变量名但环境变量缺失/为空 → 拒绝连接（fail-closed）。
# 本机调试不想鉴权：把这里设成空字符串 ""。

action_timeout_secs = 10 # int，默认 10。调用 OneBot API 的超时秒数。
# NapCat 卡住时，超时后放弃这次调用而不是无限等。

heartbeat_timeout_secs = 30 # int，默认 30；0 = 不检测。
# 收到过心跳后，超过这么多秒一个帧都没有就判定连接已死，
# 主动断开等协议端重连。没开 NapCat 心跳时不会误判安静群。

dedup_window_secs = 600 # int，默认 600（10 分钟）。重复消息判定窗口。
# 同一 message_id 落在窗口内才算重复投递；
# 窗口外允许重新入库，避免协议端重启后 ID 复用吞消息。


# -----------------------------------------------------------------------------
# [providers.*] 模型提供商
#
# 一个提供商 = 一个 OpenAI 兼容的 base_url + 密钥来源。
# 想加新的就再加一段 [providers.名字]。
# -----------------------------------------------------------------------------
[providers.deepseek]
base_url = "https://api.deepseek.com" # str，必填。程序会拼 /chat/completions。
api_key_env = "DEEPSEEK_API_KEY"      # str，必填。密钥所在的环境变量名，不写密钥本身。

[providers.ollama]
base_url = "http://127.0.0.1:11434/v1" # str，必填。本机 Ollama 的 OpenAI 兼容地址。
api_key_env = ""                       # str，留空 = 这个提供商不需要鉴权。


# -----------------------------------------------------------------------------
# [models.*] 模型声明
#
# 先声明、后调用：这里给每个模型起个名字，下面的 [model] 只写名字。
# 同一个真实模型可以声明多份，区别只在 thinking / temperature 这些参数上。
# -----------------------------------------------------------------------------
[models.flash]
provider = "deepseek"       # str，必填。引用上面 [providers.*] 里的名字。
model = "deepseek-v4-flash" # str，必填。传给提供商的真实模型 id。
visual = true               # bool，默认 false。能不能直接吃图片。
thinking = "off"            # str，默认 "auto"。取值：on / off / auto。
# auto = 不下发 thinking 字段，跟随提供商默认
# （DeepSeek 默认开启思考，effort = high）。
# 群聊回复建议 off：更快更便宜，日常效果差别不大。
# reasoning_effort = "high"     # str。思考强度：minimal/low/medium/high/xhigh/max/ultra。
# 只在 thinking 不为 off 时生效。
# temperature = 0.8             # float，0~2。思考模式下会被忽略，非思考时才下发。

[models.flash-think]
provider = "deepseek"       # 同一个底层模型，但开思考，给需要动脑的场合用
model = "deepseek-v4-flash"
visual = true
thinking = "on"
reasoning_effort = "high"

[models.qwen]
provider = "ollama"   # 本机备用，没 API key 也能跑
model = "qwen2.5:14b"
thinking = "auto"


# -----------------------------------------------------------------------------
# [model] 功能路由
#
# 每个功能是一串模型名字，按顺序尝试：前一个失败就换下一个，全挂才报错。
# 优先级是静态的：写在前面的永远先试。
# -----------------------------------------------------------------------------
[model]
chat = ["flash"]    # list，必填。最终生成回复。
planner = ["flash"] # list，默认同 chat。判断该不该说话（高频，可用便宜模型）。
summary = ["flash"] # list，默认同 chat。记忆抽取 / 画像重写。
caption = ["flash"] # list，默认空 = 复用 chat。图片转述。
# 单独配时模型必须 visual = true。
# 降级示例：chat = ["flash", "qwen"]

timeout_secs = 30 # int，默认 30。单次模型请求超时秒数。
max_retries = 2   # int，默认 2。单条路由内部重试次数（超时 / 5xx / 429）。


# -----------------------------------------------------------------------------
# [embedding] 向量模型
#
# 同样先声明再引用。只允许配一个：换 embedding 模型等于换向量空间，
# 历史向量会全部失效，所以降级只能是「不用向量」。
# -----------------------------------------------------------------------------
[models.bge]
provider = "ollama"
model = "bge-m3"

[embedding]
enabled = false # bool，默认 false。关掉时检索降级为关键词 + 时间衰减。
model = "bge"   # str，引用上面声明的模型名。
dim = 1024      # int，必须和模型真实输出维度一致（bge-m3 = 1024）。


# -----------------------------------------------------------------------------
# [vision] 图片理解
#
# 图片只在入库时被看一眼：转述成文字后替换原始图片，URL 和图片本身都不落库。
# 关掉这项，群里的图片只会变成 [图片] 三个字。
# -----------------------------------------------------------------------------
[vision]
enabled = true      # bool，默认 true。没有多模态路由时会启动失败，提醒你配好。
image_input = "url" # str，默认 "url"。把临时链接直接给模型，让模型自己取。
# 如果提供商不吃外链（返回 400），会自动降级为
# "data_uri"（瞬时下载到内存再内联），并且记住这个选择。
max_images_per_message = 4 # int，1~10，默认 4。一条消息最多转述几张图，防止刷图。
caption_max_chars = 120    # int，默认 120。转述文本上限。
download_timeout_secs = 20 # int，默认 20。降级下载图片时的超时。
max_bytes = 8388608        # int，默认 8MB。单张图最大字节数，超了直接放弃。


# -----------------------------------------------------------------------------
# [sticker] 表情包收藏与复用
#
# 只有模型判定「可复用」的表情包才会被存下来（先写 tmp 算哈希，
# 命中已有就删掉，没命中才转正），普通图片和截图一律不存。
# -----------------------------------------------------------------------------
[sticker]
enabled = true          # bool，默认 true。关掉后既不收藏也不发送表情。
dir = "data/stickers"   # str，默认 "data/stickers"。收藏目录，tmp/ 是临时区。
max_count = 64          # int，默认 64。每个群最多存多少张，满了淘汰最久没用的。
send_probability = 0.15 # float，0~1，默认 0.15。每次回复附带表情的概率。
groups = []             # list[int]，默认 []。只在这些群收藏/发送；空 = 所有白名单群。


# -----------------------------------------------------------------------------
# [groups] 群聊行为
#
# 全局默认值；单个群想例外，用文件下半部分的 [[groups.overrides]] 覆盖。
# -----------------------------------------------------------------------------
[groups]
whitelist = [123456789] # list[int]，必填。允许机器人参与的群号。
# 这是硬闸门：不在名单里的群，消息不落库、不记忆、
# 不判断、不回复，一条都不留。

blacklist_users = [] # list[int]，默认 []。群内黑名单（QQ 号）。
# 这些人的消息不入记忆，也不会被当作回复目标。
# 适合排除刷屏号、广告号。

talk_value = 0.5 # float，0~1，默认 0.5。总体发言倾向（总闸）。
# 0 = 完全闭嘴，只看不说；1 = 想说就说。
# 最终开口概率还要乘触发函数，见 [trigger]。
# 活跃群建议先给 0.1~0.2，太吵再往下压。

max_per_hour = -1 # int，默认 -1。-1 = 不限；>=1 = 每小时最多几条。
# 0 是非法值（-1 才表示不限），写了启动报错。
# 默认不限：频控挡不住风控，别指望它防封号。

max_per_day = -1 # int，默认 -1。同上，按天计。-1 = 不限。

cooldown_secs = 5 # int，默认 5。两次发送之间的最小间隔（秒）。
# 冷却期内的回复不会丢，会进发件队列按序发出（上限 3 条）。

debounce_quiet_ms = 2000 # int，默认 2000。群里安静时攒多久再判断一次（毫秒）。
# 防抖：把「一句拆成三段」的消息先收齐再一起看。

debounce_active_ms = 5000 # int，默认 5000。群里热闹时的攒消息窗口（毫秒）。
# 越热闹等越久，避免跟着一起刷屏。

inevitable_at_reply = true # bool，默认 true。被 @ / 被回复时是否必答。
# false 时仍要过概率判定——被叫了也可能装死。

inevitable_when_named = true # bool，默认 true。消息里出现 aliases 时是否必答。
# 误触发多就关掉，只保留 @ 必答。

max_reply_chars = 60 # int，默认 60。单条回复的字符上限。
# 超了会重写或截断。群聊场景短一点更像人。

dry_run = true # bool，默认 true。干跑模式：只记录判断，不真的发。
# 建议先开几天，翻决策日志确认「它想说什么」再关。
# 管理命令的回复不受影响，始终会发。

reply_delay_min_ms = 600  # int，默认 600。发送回复前的随机延迟下限（毫秒）。
reply_delay_max_ms = 1800 # int，默认 1800。上限。想秒回就都写 0。
# 模拟「看到 → 打字 → 发送」，让节奏更像人。

outbox_max = 3 # int，1~50，默认 3。冷却期间最多堆积几条待发消息。
# 满了丢最早的一条（最新的话通常更值得回）。
# 冷却 5 秒 + 队列 3 条 = 最多容忍连发 3 句。


# -----------------------------------------------------------------------------
# [[groups.overrides]] 单群覆盖
#
# 数组，一个群一段。只写想覆盖的字段，没写的沿用 [groups] 默认值。
# 可以写多段，按 group_id 精确匹配。
# -----------------------------------------------------------------------------
[[groups.overrides]]
group_id = 987654321 # int，必填。要覆盖的群号。

talk_value = 0.8 # float，可选。这个群更活跃一点。

max_per_hour = 10 # int，可选。这个群每小时最多 10 条；写 -1 恢复不限。

# max_per_day = 200           # int，可选。不写就沿用全局 -1（不限）。
# cooldown_secs = 10          # int，可选。不写就沿用全局 5 秒。
# max_reply_chars = 40        # int，可选。不写就沿用全局 60 字。
# dry_run = false             # bool，可选。不写就沿用全局 true。
# outbox_max = 5              # int，可选。不写就沿用全局 3 条。


# -----------------------------------------------------------------------------
# [trigger] 触发函数
#
# 决定「这次到底开不开口」。两个输入：兴趣（模型给）和沉默时长。
#
#   base = 兴趣 ^ interest_gamma
#   idle = 1 - 0.5 ^ (沉默秒数 / idle_half_life_secs)
#   p    = talk_value × (base + (1 - base) × idle × idle_weight)
#
# 兴趣越高、越久没说话，p 越大。默认参数下：
#   兴趣 0.5、刚说完话 → 29%；沉默 30 分钟后 → 35%
# 注意：这是「每次决策机会」的概率，不是每条消息的。
# -----------------------------------------------------------------------------
[trigger]
idle_half_life_secs = 600 # float，默认 600。沉默多久后「想说话程度」到一半（秒）。
# 调小 = 憋一会儿就想说；调大 = 更能憋。

idle_weight = 0.35 # float，0~1，默认 0.35。沉默加成占多大比重。
# 0 = 只看兴趣，沉默再久也不加分；
# 1 = 沉默足够久就一定开口（兴趣为零也会）。

interest_gamma = 0.8 # float，(0,5]，默认 0.8。兴趣曲线形状。
# <1 抬高中等兴趣（0.3 会被抬到 0.4 左右）；
# >1 更挑剔，只有真的感兴趣才开口。

min_probability = 0.0 # float，0~1，默认 0。概率下限。
# 设 0.02 可防止它彻底哑掉，代价是偶尔插没营养的话。


# -----------------------------------------------------------------------------
# [planner] 发言判断
#
# 每攒一小批消息，会先用小模型判断「值不值得接这个话茬」。
# 它只输出一个 interest（兴趣值），不负责说话；说不说由触发函数决定。
# -----------------------------------------------------------------------------
[planner]
min_confidence = 0.4 # float，0~1，默认 0.4。低于这个把握一律不开口。
# 调高 = 更少废话，也更迟钝；调低 = 更爱接话。

max_batch = 12 # int，1~50，默认 12。一次最多送多少条新消息给它看。
# 超出只保留最近 12 条，防止上下文过长。

recall_top_k = 5 # int，0~20，默认 5。判断时参考几条记忆。
# 太多会干扰判断，太少可能漏掉能接的梗。


# -----------------------------------------------------------------------------
# [persona] 人物设定
#
# 「它本来就是谁」。会渲染成一段系统提示词送进模型。
# 留空的段落不会输出——不想写就不写，不会塞一堆空标签。
#
# 与「表达学习」的分工：persona 定骨架，学来的表达补皮肉。
# taboos 优先级最高，学到的样本不能覆盖禁区。
# -----------------------------------------------------------------------------
[persona]
name = "半拍" # str，默认空。角色名；留空则回退到 bot.nickname。

identity = "一个在群里混了很久的普通群友，不是客服，也不是助手。" # 一句话就够
# str，默认空。身份：它在群里是什么角色。
# 写太长反而稀释效果。

personality = "话不多，偶尔毒舌，对具体的事比对人有耐心。" # 用「像人」的描述
# str，默认空。性格。别堆形容词，写具体行为倾向。

behavior = "不硬找话题；别人聊得起劲时不插嘴；被问到就答，答不上来就说不知道。" # 决定像不像人
# str，默认空。行为准则：什么时候参与、什么时候闭嘴。
# 这条对「像不像人」的影响比性格更大。

speech = "短句为主，少用书面语，不滥用感叹号。" # 与学来的表达叠加
# str，默认空。说话风格：长短、语气、用词习惯。
# 会与从群里学到的表达方式叠加，两者不冲突。

taboos = ["不替别人表态", "不复读别人的原话", "不聊政治和隐私"] # 优先级最高
# list[str]，默认 []。禁区，一条一句。
# 渲染成「绝不：A；B」，优先级高于学来的表达。


# -----------------------------------------------------------------------------
# [memory] 长期记忆
#
# P1 起生效。三层：原始消息 → 原子事实 → 群/人画像。
# -----------------------------------------------------------------------------
[memory]
retain_days = 30 # int，默认 30。原始消息保留天数。
# 到期自动清理，原子事实和画像不受影响。
# 调小省磁盘和查询成本，调大更「记得住」。

extract_batch_size = 80 # int，默认 80。攒够多少条消息抽一次记忆。
# 调小 = 记得更及时，但模型调用更频繁、更贵。

extract_interval_mins = 15 # int，默认 15。多久强制抽一次（分钟），兜底用。
# 群里不活跃、攒不满一批时，靠它定期消化。

recall_top_k = 12 # int，默认 12。检索时先取多少条候选记忆。
# 太多会挤占上下文、拉高成本；太少容易漏。

vector_threshold = 0.85 # float，默认 0.85。判定「两条记忆是同一件事」的相似度阈值。
# 调高 = 更少合并（容易重复）；调低 = 更容易合并（可能误并）。

recent_context = 20 # int，默认 20。生成回复时带最近多少条群聊。
# 调大更懂上下文，也更费 token。


# -----------------------------------------------------------------------------
# [prompts] 提示词目录
#
# 提示词外置，改完 /reload 生效，不用重新编译。
# 目录里有 extract.md / reply.md 就用文件，没有就用编译进来的默认值。
# -----------------------------------------------------------------------------
[prompts]
dir = "prompts" # str，默认 "prompts"。提示词目录（相对启动目录）。
# extract.md = 记忆抽取提示词；reply.md = 回复提示词。
# reply.md 里的 {name} 会被替换成角色名。


# -----------------------------------------------------------------------------
# [logging] 日志
#
# 按天切分写入 dir，同时可输出到控制台。环境变量 RUST_LOG 优先级更高。
# 决策数值（interest / 概率 / 掷骰 / 沉默时长）在 debug 级别，
# 默认配置已经把 hanpai_in_group 开到 debug，所以会进文件。
# -----------------------------------------------------------------------------
[logging]
dir = "logs"                         # str，默认 "logs"。设为空字符串则只输出控制台。
level = "info,hanpai_in_group=debug" # str，默认。格式同 RUST_LOG。
max_days = 7                         # int，默认 7。保留多少个日志文件（按天切）。
console = true                       # bool，默认 true。是否同时打到终端/journald。


# -----------------------------------------------------------------------------
# [expression] 表达学习（参考 MaiBot）
#
# 学的是「怎么说」，不是「说了什么」。
# -----------------------------------------------------------------------------
[expression]
enabled = true # bool，默认 true。总开关。关掉后不学也不用表达样本。

learn = true # bool，默认 true。是否继续从聊天里学。
# 关掉后已有样本还能用，但不再新增。

use = true # bool，默认 true。是否在生成时使用学到的表达。
# 和 learn 分开：可以只学不用，先观察学得对不对。

checked_only = false # bool，默认 false。只用人工精选过的样本。
# 打开后未经审核的样本一律不参与生成，更稳但更少。

max_per_reply = 2 # int，默认 2。每次生成最多带几条表达样本做 few-shot。
# 越多越像，也越容易变成拙劣模仿、复读。

persona_source = "group" # str，默认 "group"。模仿对象。
# "group" = 学整个群的氛围（推荐）；
# "member:<QQ>" = 以某个普通群友为参照。
# 无论哪种都不冒名、不复读原话、不替人表态。


# -----------------------------------------------------------------------------
# [admin] 管理员
# -----------------------------------------------------------------------------
[admin]
qq = [10000] # list[int]，建议填。能发管理命令的 QQ 号。
# 权限包括 /mute /unmute /reload /persona 等。
# 留空时没人能管它，只能改配置文件重启。
